<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0277BD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sun" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" style="stop-color:#FFE066;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F0FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#00000033"/>
    </filter>
    <filter id="sunGlow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundedRect">
      <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="url(#bg)"/>

  <!-- Sun rays -->
  <g clip-path="url(#roundedRect)">
    <g transform="translate(390, 390)" opacity="0.7">
      <!-- 8 rays -->
      <line x1="0" y1="-210" x2="0" y2="-155" stroke="#FFD54F" stroke-width="28" stroke-linecap="round"/>
      <line x1="148" y1="-148" x2="110" y2="-110" stroke="#FFD54F" stroke-width="28" stroke-linecap="round"/>
      <line x1="210" y1="0" x2="155" y2="0" stroke="#FFD54F" stroke-width="28" stroke-linecap="round"/>
      <line x1="148" y1="148" x2="110" y2="110" stroke="#FFD54F" stroke-width="28" stroke-linecap="round"/>
      <line x1="0" y1="210" x2="0" y2="155" stroke="#FFD54F" stroke-width="28" stroke-linecap="round"/>
      <line x1="-148" y1="148" x2="-110" y2="110" stroke="#FFD54F" stroke-width="28" stroke-linecap="round"/>
      <line x1="-210" y1="0" x2="-155" y2="0" stroke="#FFD54F" stroke-width="28" stroke-linecap="round"/>
      <line x1="-148" y1="-148" x2="-110" y2="-110" stroke="#FFD54F" stroke-width="28" stroke-linecap="round"/>
    </g>

    <!-- Sun disk -->
    <circle cx="390" cy="390" r="130" fill="url(#sun)" filter="url(#sunGlow)"/>

    <!-- Cloud (main body) -->
    <g filter="url(#shadow)">
      <!-- cloud base -->
      <rect x="260" y="590" width="510" height="160" rx="80" fill="url(#cloud)"/>
      <!-- cloud bumps -->
      <circle cx="360" cy="590" r="95" fill="url(#cloud)"/>
      <circle cx="490" cy="548" r="120" fill="url(#cloud)"/>
      <circle cx="630" cy="570" r="100" fill="url(#cloud)"/>
      <circle cx="740" cy="600" r="78" fill="url(#cloud)"/>
    </g>
  </g>
</svg>
